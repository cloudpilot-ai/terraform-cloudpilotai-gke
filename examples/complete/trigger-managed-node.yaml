apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpilot-managed-trigger
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpilot-managed-trigger
  template:
    metadata:
      labels:
        app: cloudpilot-managed-trigger
    spec:
      nodeSelector:
        workload: cloudpilot-managed
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
